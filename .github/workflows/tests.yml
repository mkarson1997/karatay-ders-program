name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scheduler-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run scheduling tests
        run: npm test
