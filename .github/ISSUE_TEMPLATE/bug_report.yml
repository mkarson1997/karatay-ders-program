name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this project. Do not include passwords, API keys, tokens, private schedules, or other sensitive data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest reproducible course/time example or exact steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and Node version if running tests locally.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Screenshots are welcome after removing personal information.
